[project]
name = "image-sharpening"
version = "1.0.0"
description = "Five manually implemented grayscale image sharpening methods"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2.1", "pillow>=11", "matplotlib>=3.9"]

[project.scripts]
image-sharpening = "image_sharpening.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8.3", "pyinstaller>=6.11", "reportlab>=4.2", "pypdf>=5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
